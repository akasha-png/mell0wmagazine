<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mellow Magazine</title>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      overflow-x: hidden;
    }

    img.fullscreen {
      width: calc(100vw - 10.4vw);
      height: auto;
      display: block;
      margin: 0 7.3vw;
    }

    .page1-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .logo-overlay {
      position: absolute;
      top: 23%;
      left: 50%;
      transform: translateX(-49%);
      width: 78vw;
      height: auto;
    }

    .latestrelease-overlay {
      position: absolute;
      top: 50%;
      left: calc(50% + 4.2vw);
      transform: translateX(-130%);
      width: 15.6vw;
      height: auto;
    }

    .zine-overlay {
      position: absolute;
      top: 44%;
      left: calc(50% + 0.6vw);
      transform: translateX(5%);
      width: 33vw;
      height: auto;
      transition: transform 0.2s ease, scale 0.2s ease;
      cursor: pointer;
    }

    .zine-overlay:hover {
      transform: translateX(5%);
      border-bottom: 5px solid rgb(255, 255, 255);
    }

    .releasedate-overlay {
      position: absolute;
      top: 57%;
      left: calc(50% + 0.6vw);
      transform: translateX(30%);
      width: 25vw;
      height: auto;
    }

    .page2-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .issueselect-overlay {
      position: absolute;
      top: calc(25%);
      left: 67%;
      transform: translateX(-50%);
      width: 30vw;
      height: auto;
    }

    .newsletterselect-overlay {
      position: absolute;
      top: 60%;
      left: 73%;
      transform: translate(-50%, -70%) rotate(15deg);
      width: 35vw;
      height: auto;
    }

    .zineselect-overlay {
      position: absolute;
      top: 79%;
      left: 70%;
      transform: translate(-50%, -70%) rotate(30deg);
      width: 30vw;
      height: auto;
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .issueselect-overlay {
      transition: transform 0.2s ease;
      cursor: pointer;
      z-index: 3;
    }

    .issueselect-overlay:hover {
      transform: translateX(-50%) scale(1.05);
    }

    .newsletterselect-overlay {
      transition: transform 0.2s ease;
      cursor: pointer;
      z-index: 2;
    }

    .newsletterselect-overlay:hover {
      transform: translate(-50%, -70%) rotate(15deg) scale(1.05);
    }

    .zineselect-overlay {
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .zineselect-overlay:hover {
      transform: translate(-50%, -70%) rotate(30deg) scale(1.05);
    }
  </style>
</head>
<body>

  <div class="page1-wrapper">
    <img class="fullscreen" src="Images/page1.jpg" alt="">
    <img class="logo-overlay" src="Images/mellowlogo2.png" alt="Mellow Logo">
    <a href="issues/issues-01.html"><img class="zine-overlay" src="Images/issue.1.png" alt="Zine 1"></a>
    <img class="releasedate-overlay" src="Images/april4.png" alt="Release Date">
  </div>
  <div class="page2-wrapper">
    <img class="fullscreen" src="Images/Page2.JPG" alt="">
    <!-- hidden: <img class="issueselect-overlay" src="Images/issueselect.png" alt="Issues"> -->
    <!-- hidden: <img class="newsletterselect-overlay" src="Images/newsletterselect.png" alt="Newsletter"> -->
    <!-- hidden: <img class="zineselect-overlay" src="Images/zineselect.png" alt="Zine"> -->
    <img class="issueselect-overlay" src="Images/homepagequestion.png" alt="Issues">
    <img class="newsletterselect-overlay" src="Images/homepagequestion.png" alt="Newsletter">
    <img class="zineselect-overlay" src="Images/homepagequestion.png" alt="Zine">
  </div>
  <img class="fullscreen" src="Images/page3.jpg" alt="">

</body>
</html>
